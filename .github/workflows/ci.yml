name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install site and validation dependencies
        run: python -m pip install -r requirements.txt ruff==0.16.5

      - name: Check tracked files and Action pins
        run: python scripts/check_repository_safety.py

      - name: Test deployment helpers
        run: python -m unittest discover -s scripts/tests -v

      - name: Lint Python
        run: >-
          python -m ruff check --isolated --no-cache --select E4,E7,E9,F
          scripts mcp/franchina_mcp mcp/tests
          docs/assets/littleTools/CurrencyCalculator/fetch_history.py

      - name: Compile site scripts
        run: >-
          python -m compileall -q scripts
          docs/assets/littleTools/CurrencyCalculator/fetch_history.py

      - name: Build site
        run: python -m mkdocs build --strict --clean

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install MCP dependencies
        run: python -m pip install -r mcp/requirements.txt

      - name: Run MCP tests
        working-directory: mcp
        run: python -m unittest discover -s tests -v

      - name: Compile MCP
        run: python -m compileall -q mcp/franchina_mcp mcp/tests
