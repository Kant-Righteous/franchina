name: Update Currency Rates

on:
  schedule:
    # 每天 00:00 UTC 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: read

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Backfill history
        run: |
          python docs/assets/littleTools/CurrencyCalculator/fetch_history.py

      - name: Run update script
        run: |
          python scripts/update_currency.py

      - name: Deploy rates.json to Server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docs/assets/littleTools/CurrencyCalculator/*.json"
          target: "/var/www/franchina/assets/littleTools/CurrencyCalculator/"
          strip_components: 4

      - name: Purge Cloudflare Cache
        run: python scripts/purge_cloudflare.py
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
