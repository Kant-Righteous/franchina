name: Update Currency Rates

on:
  schedule:
    # 每天 00:00 UTC 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: |
          python scripts/update_currency.py

      - name: Deploy rates.json to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docs/assets/littleTools/CurrencyCalculator/rates.json"
          target: "/var/www/franchina/assets/littleTools/CurrencyCalculator/"
          strip_components: 4

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
