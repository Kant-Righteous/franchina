name: Update Currency Rates

on:
  schedule:
    # 每天 00:00 UTC 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: |
          python scripts/update_currency.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/assets/littleTools/CurrencyCalculator/rates.json
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update currency rates"
            git pull --rebase # Ensure we have the latest changes
            git push
          fi
