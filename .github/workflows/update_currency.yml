name: Update Currency Rates

on:
  schedule:
    # 每天 00:00 UTC 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: read

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Backfill history
        run: |
          python docs/assets/life/finance/currency-calculator/fetch_history.py

      - name: Run update script
        run: |
          python scripts/update_currency.py

      - name: Deploy rates.json to Server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docs/assets/life/finance/currency-calculator/*.json"
          target: "/var/www/franchina/assets/life/finance/currency-calculator/"
          strip_components: 5

      - name: Purge Cloudflare Cache
        run: python scripts/purge_cloudflare.py
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
