name: Update MCP Rates

on:
  schedule:
    # 每天 01:00 UTC 运行（巴黎冬令时 02:00、夏令时 03:00），晚于 n8n 在巴黎时间 01:30 的采集
    - cron: '0 1 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  export-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-mcp-rates
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export official rates on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/mcp_rates_key"
          trap 'rm -f "$key_file"' EXIT
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"

          # 标准输入传入导出脚本；服务器上以只读方式读取 MCP 数据库，校验后原子替换线上文件
          remote_script=$(cat <<'EOF'
          set -eu
          target_dir=/var/www/franchina/assets/life/finance/currency-calculator
          tmp_file="$target_dir/.mcp_rates.json.tmp"
          mkdir -p "$target_dir"
          trap 'rm -f "$tmp_file"' EXIT
          sudo -n -u ubuntu python3 - > "$tmp_file"
          python3 -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if isinstance(data.get("sources"), list) else "invalid mcp_rates.json")' "$tmp_file"
          chmod 644 "$tmp_file"
          mv "$tmp_file" "$target_dir/mcp_rates.json"
          echo "Updated $target_dir/mcp_rates.json"
          EOF
          )

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/mcp_rates_known_hosts" \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "$remote_script" \
            < scripts/export_mcp_rates.py
