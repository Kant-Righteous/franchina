<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">租房流程清单</title>
  <desc id="desc">法国学生租房从找房到退房的关键节点</desc>
  <rect width="960" height="300" fill="#f7faf8"/>
  <text x="48" y="54" font-size="28" font-family="Noto Sans SC, Arial, sans-serif" font-weight="700" fill="#111827">租房不要跳过的 5 件事</text>
  <g font-family="Noto Sans SC, Arial, sans-serif">
    <g transform="translate(55,120)">
      <rect width="154" height="112" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="77" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">核验房源</text>
      <text x="77" y="72" text-anchor="middle" font-size="13" fill="#0369a1">地址 / 房东 / 合同</text>
    </g>
    <g transform="translate(232,120)">
      <rect width="154" height="112" rx="14" fill="#dcfce7" stroke="#4ade80"/>
      <text x="77" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">准备 dossier</text>
      <text x="77" y="72" text-anchor="middle" font-size="13" fill="#166534">证件 / 收入 / 担保</text>
    </g>
    <g transform="translate(409,120)">
      <rect width="154" height="112" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="77" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">签 bail</text>
      <text x="77" y="72" text-anchor="middle" font-size="13" fill="#92400e">看押金和 charges</text>
    </g>
    <g transform="translate(586,120)">
      <rect width="154" height="112" rx="14" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="77" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">买保险</text>
      <text x="77" y="72" text-anchor="middle" font-size="13" fill="#5b21b6">交钥匙前提供证明</text>
    </g>
    <g transform="translate(763,120)">
      <rect width="154" height="112" rx="14" fill="#ffe4e6" stroke="#fb7185"/>
      <text x="77" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#881337">做 état des lieux</text>
      <text x="77" y="72" text-anchor="middle" font-size="13" fill="#9f1239">拍照留证</text>
    </g>
  </g>
</svg>
