    <circle cx="480" cy="74" r="38" fill="#a78bfa"/>
    <text x="480" y="80" text-anchor="middle" font-size="15" fill="#fff">使领馆渠道</text>
    <circle cx="480" cy="258" r="38" fill="#facc15"/>
    <text x="480" y="264" text-anchor="middle" font-size="15" fill="#713f12">同学社区</text>
    <line x1="269" y1="166" x2="426" y2="166" stroke="#cbd5e1" stroke-width="5"/>
    <line x1="534" y1="166" x2="691" y2="166" stroke="#cbd5e1" stroke-width="5"/>
    <line x1="480" y1="112" x2="480" y2="112" stroke="#cbd5e1" stroke-width="5"/>
    <line x1="480" y1="220" x2="480" y2="220" stroke="#cbd5e1" stroke-width="5"/>
  </g>
