<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">护照办理流程</title>
  <desc id="desc">中国领事 APP 办理护照旅行证的主要步骤</desc>
  <rect width="960" height="300" fill="#f7f9fc"/>
  <text x="48" y="54" font-size="28" font-family="Noto Sans SC, Arial, sans-serif" font-weight="700" fill="#1f2937">护照 / 旅行证办理路径</text>
  <text x="48" y="86" font-size="15" font-family="Noto Sans SC, Arial, sans-serif" fill="#6b7280">先线上申办，再按使领馆审核结果递交旧证件或现场取证</text>
  <g font-family="Noto Sans SC, Arial, sans-serif">
    <g transform="translate(48,130)">
      <rect width="150" height="96" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">准备材料</text>
      <text x="75" y="66" text-anchor="middle" font-size="13" fill="#1e40af">护照 / 居留 / 照片</text>
    </g>
    <path d="M214 178h54" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(284,130)">
      <rect width="150" height="96" rx="14" fill="#dcfce7" stroke="#4ade80"/>
      <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">APP 填报</text>
      <text x="75" y="66" text-anchor="middle" font-size="13" fill="#166534">中国领事模块</text>
    </g>
    <path d="M450 178h54" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(520,130)">
      <rect width="150" height="96" rx="14" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">等待审核</text>
      <text x="75" y="66" text-anchor="middle" font-size="13" fill="#92400e">补件 / 视频核验</text>
    </g>
    <path d="M686 178h54" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(756,130)">
      <rect width="150" height="96" rx="14" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">缴费取证</text>
      <text x="75" y="66" text-anchor="middle" font-size="13" fill="#5b21b6">携旧护照现场领取</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
