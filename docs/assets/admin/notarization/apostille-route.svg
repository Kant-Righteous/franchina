<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">公证认证路径</title>
  <desc id="desc">法国和中国之间公文书办理 Apostille 的路径</desc>
  <rect width="960" height="300" fill="#fbfaf7"/>
  <text x="48" y="54" font-size="28" font-family="Noto Sans SC, Arial, sans-serif" font-weight="700" fill="#1f2937">公证、认证与附加证明书</text>
  <text x="48" y="86" font-size="15" font-family="Noto Sans SC, Arial, sans-serif" fill="#6b7280">2023-11-07 起，中法间多数公文书用 Apostille 取代领事认证</text>
  <g font-family="Noto Sans SC, Arial, sans-serif">
    <rect x="70" y="128" width="250" height="96" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="195" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">法国文件去中国</text>
    <text x="195" y="194" text-anchor="middle" font-size="13" fill="#0369a1">Notaire / mairie / tribunal</text>
    <rect x="355" y="128" width="250" height="96" rx="14" fill="#fee2e2" stroke="#f87171"/>
    <text x="480" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">申请 Apostille</text>
    <text x="480" y="194" text-anchor="middle" font-size="13" fill="#991b1b">apostille.notaires.fr</text>
    <rect x="640" y="128" width="250" height="96" rx="14" fill="#ecfdf5" stroke="#34d399"/>
    <text x="765" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">交给用文单位</text>
    <text x="765" y="194" text-anchor="middle" font-size="13" fill="#047857">按要求补翻译 / 时效</text>
    <path d="M326 176h23" stroke="#9ca3af" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M611 176h23" stroke="#9ca3af" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
