site_name: FranChina 留法指南
site_url: https://franchina.qzz.io
site_description: 你的法国留学生活百宝箱
repo_url: ""

theme:
  name: material
  language: zh
  features:
    # - navigation.sections  # 禁用以启用折叠功能
    - navigation.tabs
    - navigation.top
    - navigation.instant
    # - navigation.expand # 禁用以使得左侧导航栏默认是折叠的
    - navigation.indexes
    - search.highlight
    # - search.suggest # 禁用使得搜索框不会有残影
    - content.code.copy

  logo: assets/home/logo.png
  favicon: assets/home/favicon.png
  palette:
    scheme: default
    primary: indigo # Ignored due to CSS override, but keeping valid
    accent: pink    # Ignored due to CSS override, but keeping valid
  font:
    text: Noto Sans SC # Loads webfont as fallback
    code: Roboto Mono

extra_css:
  # Core 核心基础
  - stylesheets/core/variables.css
  - stylesheets/core/base.css
  - stylesheets/core/animations.css
  # Layout 布局
  - stylesheets/layout/header.css
  - stylesheets/layout/sidebar.css
  - stylesheets/layout/responsive.css
  # Pages 页面与组件
  - stylesheets/pages/content.css
  - stylesheets/pages/components.css
  - stylesheets/pages/home.css

copyright: ""

nav:
  - 首页: index.md
  - 行前与落地:
      - 行前清单: pages/preparation/checklist.md
      - 落地第一周: pages/arrival/first-week.md
  - 行政手续:
      - CAF (房补): pages/admin/caf.md
      - Ameli (医保): pages/admin/ameli.md
      - 签证与居留: pages/admin/visa.md
      - 银行开户: pages/admin/bank.md
  - 生活指南:
      - 住房: pages/life/housing.md
      - 交通出行: pages/life/transport.md
      - 医疗健康: pages/life/health.md
  - 城市指南:
      - 图卢兹:
          - 城市简介: pages/cities/toulouse/index.md
          - 本地交通: pages/cities/toulouse/transport.md
          - 生活圈: pages/cities/toulouse/life.md
      - 巴黎:
          - 城市简介: pages/cities/paris/index.md
          - 本地交通: pages/cities/paris/transport.md
          - 生活圈: pages/cities/paris/life.md
  - 小工具:
      - 小工具:
          - 汇率计算器: pages/littleTools/CurrencyCalculator.md
  - 关于:
      - 关于我们: pages/about.md
      - FAQ: pages/about/faq.md

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes
