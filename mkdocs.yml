site_name: FranChina 留法指南
site_url: https://franchina.qzz.io
site_description: 你的法国留学生活百宝箱
repo_url: ""

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - navigation.indexes
  palette:
    scheme: default
    primary: blue
    accent: red
  font:
    text: Noto Sans SC
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

copyright: ""

nav:
  - 首页: index.md
  - 行前与落地:
      - 行前清单: preparation/checklist.md
      - 落地第一周: arrival/first-week.md
  - 行政手续 (通用):
      - CAF (房补): admin/caf.md
      - Ameli (医保): admin/ameli.md
      - 签证与居留: admin/visa.md
      - 银行开户: admin/bank.md
  - 生活指南 (通用):
      - 住房: life/housing.md
      - 交通出行: life/transport.md
      - 医疗健康: life/health.md
  - 城市指南:
      - 图卢兹 (Toulouse):
          - 城市概况: cities/toulouse/index.md
          - 本地交通: cities/toulouse/transport.md
          - 生活圈: cities/toulouse/life.md
  - 关于:
      - FAQ: about/faq.md
      - 关于我们: about.md

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes
