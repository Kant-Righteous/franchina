site_name: FranChina 法国留学
site_url: https://franchina.qzz.io
site_description: 你的法国留学生活百宝箱
repo_url: ""

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    # - navigation.sections  # 禁用以启用折叠功能
    - navigation.tabs
    - navigation.top
    - navigation.instant
    # - navigation.expand # 禁用以使得左侧导航栏默认是折叠的
    - navigation.indexes
    - search.highlight
    # - search.suggest # 禁用使得搜索框不会有残影
    - content.code.copy

  logo: assets/home/logo.png
  favicon: favicon.ico
  palette:
    scheme: default
    primary: indigo # Ignored due to CSS override, but keeping valid
    accent: pink # Ignored due to CSS override, but keeping valid
  # 使用系统字体，避免外部 Web Font 到达后引发布局闪动。
  font: false

extra_css:
  # Core 核心基础
  - stylesheets/core/variables.css
  - stylesheets/core/base.css
  - stylesheets/core/animations.css
  # Layout 布局
  - stylesheets/layout/header.css
  - stylesheets/layout/sidebar.css
  # Pages 页面与组件
  - stylesheets/pages/content.css
  - stylesheets/pages/components.css
  - stylesheets/pages/home.css
  - stylesheets/pages/quick-links.css
  # Responsive 响应式覆盖（必须在页面样式之后加载）
  - stylesheets/layout/responsive.css

copyright: "Copyright &copy; 2024-2026 FranChina 法国留学 | 本站采用 <a href='https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans' target='_blank' rel='noopener noreferrer'>CC BY-NC-SA 4.0</a> 协议进行许可，未经授权禁止商业使用。"

nav:
  - 首页: index.md
  - 行李建议: pages/packing-list.md
  - 初到法国: pages/first-week.md
  - 行政手续:
      - 赴法之前:
          - 办理护照: pages/admin/before/passport.md
          - 办理公证: pages/admin/before/notarization.md
          - 办理签证: pages/admin/before/visa.md
      - 抵法之后:
          - 办理居留: pages/admin/after/residence.md
          - 办理医保: pages/admin/after/ameli.md
          - 办理房补: pages/admin/after/caf.md
  - 生活指南:
      - 财务管理:
          - 办理银行卡: pages/life/finance/bank.md
          - 汇率计算器: pages/littleTools/CurrencyCalculator.md
      - 交通出行:
          - 自行车: pages/life/transport/bike.md
          - 公交: pages/life/transport/bus.md
          - 出租车: pages/life/transport/taxi.md
          - 大巴: pages/life/transport/coach.md
          - 地铁: pages/life/transport/subway.md
          - 高铁列车: pages/life/transport/train.md
          - 飞机: pages/life/transport/plane.md
      - 信息通讯:
          - 办理手机卡: pages/life/communication/sim-card.md
      - 住房管理: pages/life/housing.md
      - 医疗健康: pages/life/health.md
  - 常用网站导航: pages/quick-links.md
  - 寻求帮助:
      - 全法学联: pages/help/cssa.md
      - 驻法使领馆: pages/help/embassy.md
  - 城市指南:
      - 图卢兹:
          - 城市简介: pages/cities/toulouse/index.md
          - 本地交通: pages/cities/toulouse/transport.md
          - 生活圈: pages/cities/toulouse/life.md
      - 巴黎:
          - 城市简介: pages/cities/paris/index.md
          - 本地交通: pages/cities/paris/transport.md
          - 生活圈: pages/cities/paris/life.md
      - 里昂:
          - 城市简介: pages/cities/lyon/index.md
          - 本地交通: pages/cities/lyon/transport.md
          - 生活圈: pages/cities/lyon/life.md
      - 马赛:
          - 城市简介: pages/cities/marseille/index.md
          - 本地交通: pages/cities/marseille/transport.md
          - 生活圈: pages/cities/marseille/life.md
  - 小工具:
      - 汇率计算器: pages/littleTools/CurrencyCalculator.md
  - 关于: pages/about.md

plugins:
  - search:
      lang: zh
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
